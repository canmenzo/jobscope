[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines are fine here (wide data tables, embedded HTML/CSS).
# E741: `l` reads fine as the short-lived lowercased-location local in filter.py.
ignore = ["E501", "E741"]
