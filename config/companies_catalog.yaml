# Curated catalog of US tech companies reachable via public ATS APIs.
# Grouped by ATS source. The "slug" is the company's board identifier on that ATS.
#
# Every slug below was verified live (it resolved and returned postings) when this
# list was built. Slugs do go stale over time — when one fails, the dashboard
# lists it at the BOTTOM with the reason and a direct careers link, so it's easy
# to spot and prune. Add companies by dropping a slug under the right source.
#
# Board URL patterns (used for the careers link when a slug fails):
#   greenhouse      -> https://job-boards.greenhouse.io/<slug>
#   lever           -> https://jobs.lever.co/<slug>
#   ashby           -> https://jobs.ashbyhq.com/<slug>
#   smartrecruiters -> https://jobs.smartrecruiters.com/<slug>
#   recruitee       -> https://<slug>.recruitee.com/

