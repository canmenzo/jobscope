# SmartRecruiters + Recruitee fetchers are supported (see fetch.py) but ship
# empty: few US-tech companies use them with a public board. Add a verified slug
# here to include it, e.g.:
#   smartrecruiters:
#     - Visa
#   recruitee:
#     - <slug>   # https://<slug>.recruitee.com must resolve
smartrecruiters:
  - ServiceNow
  # verified live 2026-08-10
  - Experian
  - Visa
  # verified live 2026-08-12
  - Alorica

recruitee:
  - edifecs

# Workday tenants. Slug format is "tenant:wdN:site" — all three parts come from
# the careers URL, e.g. https://capitalone.wd12.myworkdayjobs.com/Capital_One
# becomes capitalone:wd12:Capital_One. These are where the enterprise/MSSP/
# finance/insurance SOC-analyst roles live; the startup boards above skew
# senior and carry almost no entry-level security work.
#
# The list endpoint has no descriptions, so these are hydrated after the title
# gate (see fetch.hydrate_descriptions). `limit` is capped at 20 server-side and
# searchText is fuzzy, so the fetcher pages through and we filter ourselves.
# Verified live 2026-08-11.
workday:
  - capitalone:wd12:Capital_One
  - travelers:wd5:External
  - truist:wd1:Careers
  - rackspace:wd1:External
  - salesforce:wd12:External_Career_Site
  - nvidia:wd5:NVIDIAExternalCareerSite
  - workday:wd5:Workday
  # verified live 2026-08-11 — banks/insurers/telecom, where SOC analyst work is
  - keybank:wd5:External_Career_Site
  - pnc:wd5:External
  - tmobile:wd1:External
  - unum:wd1:External
  - vystarcu:wd1:Careers          # Jacksonville FL credit union
  - bmo:wd3:External
  - southstatebank:wd5:External
#
# Defence contractors are deliberately ABSENT. leidos, gdit and caci all have
# working boards with hundreds of security roles, but every one of them is
# clearance-gated, so they survive the title filter, cost a paginated fetch
# plus a description hydration each, and are then dropped to zero by the
# clearance rule. Measured: 12 Leidos roles before hydration, 0 after. Add them
# back only if the config stops filtering on clearance.

