# Tech-only job taxonomy (USA only).
# Each sub-sector lists:
#   titles   - shown in the setup picker; the user chooses which to target
#   keywords - case-insensitive substrings used to FILTER in-scope roles and SCORE relevance
# Add/remove freely. Keep everything tech — this skill intentionally ignores
# non-tech functions (sales, marketing, recruiting, finance, legal, HR, etc.).

sub_sectors:
  cybersecurity:
    label: Cybersecurity
    titles:
      - Security Analyst
      - SOC Analyst
      - Detection Engineer
      - Detection & Response Engineer
      - Threat Hunter
      - Threat Intelligence Analyst
      - Incident Responder
      - Security Engineer
      - Application Security Engineer
      - Cloud Security Engineer
      - Product Security Engineer
      - Offensive Security Engineer / Penetration Tester
      - Malware Analyst / Reverse Engineer
      - AI Security Engineer
      - Security Operations Engineer
      - GRC / Security Compliance Analyst
    keywords:
      - security analyst
      - soc
      - detection
      - threat hunt
      - threat intel
      - incident response
      - incident responder
      - security engineer
      - application security
      - appsec
      - cloud security
      - product security
      - offensive security
      - penetration test
      - pentest
      - red team
      - blue team
      - purple team
      - malware
      - reverse engineer
      - security operations
      - infosec
      - vulnerability
      - dfir
      - ai security
      - grc

