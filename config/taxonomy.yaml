      - desktop support
      - it support
      - systems engineer

  product-design:
    label: Product / Design
    titles:
      - Product Manager
      - Technical Program Manager
      - Product Designer
      - UX Designer
    keywords:
      - product manager
      - program manager
      - technical program
      - product designer
      - ux designer
      - ui designer
      - user experience

  qa-test:
    label: QA / Test
    titles:
      - QA Engineer
      - Software Engineer in Test (SDET)
      - Automation Engineer
    keywords:
      - qa engineer
      - quality assurance
      - sdet
      - software engineer in test
      - test engineer
      - automation engineer

# Hygiene drop-list: titles containing these are never tech roles — dropped
# regardless of selected sub-sectors so non-tech noise never reaches the results.
nontech_drop:
  - sales
  - account executive
  - account manager
  - marketing
  - recruit
  - talent acquisition
  - human resources
  - people operations
  - finance
  - accountant
  - accounting
  - controller
  - legal
  - counsel
  - paralegal
  - office manager
  - executive assistant
  - facilities
  - customer success
  - customer support
  - solutions engineer
  - sales engineer
  - business development

# Exceptions to nontech_drop. Checked first: a title containing one of these is
# kept even if it also contains a drop term. Needed because the AI labs ship
# genuinely technical roles under names the drop-list treats as sales — a
# "Forward Deployed Solutions Engineer" at Palantir/OpenAI writes code.
nontech_keep:
  - forward deployed
  - applied ai
  - ai solutions engineer
  - ml solutions engineer
  - security solutions engineer
