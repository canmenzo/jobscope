# Tech-only job taxonomy (USA only).
# Each sub-sector lists:
#   titles   - shown in the setup picker; the user chooses which to target
#   keywords - case-insensitive substrings used to FILTER in-scope roles and SCORE relevance
# Add/remove freely. Keep everything tech — this skill intentionally ignores
# non-tech functions (sales, marketing, recruiting, finance, legal, HR, etc.).

sub_sectors:
  cybersecurity:
    label: Cybersecurity
    titles:
      - Security Analyst
      - SOC Analyst
      - Detection Engineer
      - Detection & Response Engineer
      - Threat Hunter
      - Threat Intelligence Analyst
      - Incident Responder
      - Security Engineer
      - Application Security Engineer
      - Cloud Security Engineer
      - Product Security Engineer
      - Offensive Security Engineer / Penetration Tester
      - Malware Analyst / Reverse Engineer
      - AI Security Engineer
      - Security Automation Engineer
      - Agentic SOC Engineer
      - SOAR Engineer
      - AI Red Team Engineer
      - Security Operations Engineer
      - GRC / Security Compliance Analyst
    keywords:
      - security analyst
      - soc
      - detection
      - threat hunt
      - threat intel
      - incident response
      - incident responder
      - security engineer
      - application security
      - appsec
      - cloud security
      - product security
      - offensive security
      - penetration test
      - pentest
      - red team
      - blue team
      - purple team
      - malware
      - reverse engineer
      - security operations
      - infosec
      - vulnerability
      - dfir
      - ai security
      - grc
      # security x AI — the roles that sit between the SOC and the model
      - security automation
      - soar
      - agentic soc
      - ai soc
      - autonomous soc
      - llm security
      - ai red team
      - model security
      - prompt injection
      - mlsecops
      - ai governance
      - offensive ai

  software-engineering:
    label: Software Engineering
    titles:
      - Software Engineer
      - Backend Engineer
      - Frontend Engineer
      - Full Stack Engineer
      - Mobile Engineer (iOS / Android)
      - Staff Software Engineer
      - Engineering Manager
    keywords:
      - software engineer
      - backend
      - back end
      - frontend
      - front end
      - full stack
      - full-stack
      - ios engineer
      - android engineer
      - mobile engineer
      - web engineer
      - software developer
      - sde

  data-ml-ai:
    label: Data / ML / AI
    titles:
      - Data Engineer
      - Data Scientist
      - Machine Learning Engineer
      - AI Engineer
      - Analytics Engineer
      - Data Analyst
    keywords:
      - data engineer
      - data scientist
      - machine learning
      - ml engineer
      - ai engineer
      - applied scientist
      - analytics engineer
      - data analyst
      - mlops
      - deep learning

  ai-engineering:
    label: AI / Agentic Engineering
    # Distinct from data-ml-ai, which is the classic data/ML ladder (pipelines,
    # models, analytics). This one is the LLM-product ladder: people who build
    # ON models — agents, evals, RAG, inference plumbing, and the customer-facing
    # forward-deployed work. AI labs post most of these under generic titles
    # ("Member of Technical Staff"), so that is a first-class title here.
    titles:
      - AI Engineer
      - Applied AI Engineer
      - Forward Deployed Engineer
      - Member of Technical Staff
      - LLM Engineer
      - Agent Engineer
      - Research Engineer
      - AI Infrastructure Engineer
      - AI Platform Engineer
      - AI Automation Engineer
      - Prompt Engineer
      - AI Product Engineer
      - Evaluation Engineer
    keywords:
      - ai engineer
      - applied ai
      - agentic
      - ai agent
      - llm
      - large language model
      - generative ai
      - genai
      - foundation model
      - frontier model
      - forward deployed
      - member of technical staff
      - research engineer
      - prompt engineer
      - retrieval augmented
      - retrieval-augmented
      - fine-tun
      - finetun
      - inference
      - model eval
      - ai platform
      - ai infrastructure
      - ai automation
      - ai solutions
      - copilot

  devops-cloud:
    label: DevOps / SRE / Cloud / Platform
    titles:
      - DevOps Engineer
      - Site Reliability Engineer (SRE)
      - Platform Engineer
      - Cloud Engineer
      - Infrastructure Engineer
    keywords:
